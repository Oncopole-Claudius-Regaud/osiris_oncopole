name: ETL Oncopole Deploy

on:
  push:
    branches:
      - version_1

jobs:
  deploy:
    name: Deploy to Airflow Server
    runs-on: self-hosted

    steps:
      - name: Checkout repository (FULL history)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          fetch-tags: false

      - name: Deploy (fresh clone from workspace, clean)
        shell: bash
        run: |
          set -euo pipefail

          TARGET="$HOME/airflow/dags/osiris_oncopole"
          BRANCH="${GITHUB_REF_NAME}"

          # Sanity: confirmer que le workspace n'est pas shallow
          git -C "$GITHUB_WORKSPACE" rev-parse --is-shallow-repository

          # Repartir propre pour éviter un .git incomplet/corrompu
          rm -rf "$TARGET"
          mkdir -p "$(dirname "$TARGET")"

          # --no-local évite les hardlinks / effets bizarres entre repos locaux
          git clone --no-local --branch "$BRANCH" "$GITHUB_WORKSPACE" "$TARGET"

          # Nettoyage (optionnel mais utile)
          git -C "$TARGET" reset --hard
          git -C "$TARGET" clean -fd

          git -C "$TARGET" status

      - name: Redémarrer Airflow
        shell: bash
        run: |
          set -euo pipefail
          sudo systemctl restart airflow-webserver.service
          sudo systemctl restart airflow-scheduler.service